<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CodeAlpha E-Commerce Store</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- ===============================
         Navigation Bar
    ================================ -->

    <header class="navbar">

        <div class="logo">
            CodeAlpha Store
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="cart.html">
                Cart
                <span id="cart-count">0</span>
            </a>

            <a href="orders.html">
                My Orders
            </a>

            <a
                href="login.html"
                id="login-link"
            >
                Login
            </a>

            <a
                href="#"
                id="logout-link"
                style="display: none;"
            >
                Logout
            </a>

        </nav>

    </header>


    <!-- ===============================
         Hero Section
    ================================ -->

    <section class="hero">

        <div class="hero-content">

            <h1>
                Welcome to CodeAlpha Store
            </h1>

            <p>
                Discover quality products at great prices.
            </p>

            <a
                href="#products"
                class="hero-button"
            >
                Shop Now
            </a>

        </div>

    </section>


    <!-- ===============================
         Products Section
    ================================ -->

    <main>

        <section
            id="products"
            class="products-section"
        >

            <h2>
                Our Products
            </h2>

            <div
                id="products-container"
                class="products-container"
            >

                <p>
                    Loading products...
                </p>

            </div>

        </section>

    </main>


    <!-- ===============================
         Footer
    ================================ -->

    <footer>

        <p>
            © 2026 CodeAlpha Store.
            All rights reserved.
        </p>

    </footer>


    <!-- ===============================
         JavaScript
    ================================ -->

    <script src="js/common.js"></script>

    <script src="js/products.js"></script>

</body>

</html>
