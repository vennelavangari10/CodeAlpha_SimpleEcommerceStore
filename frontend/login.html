<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - CodeAlpha Store</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- ===============================
         Navigation Bar
    ================================ -->

    <header class="navbar">

        <div class="logo">
            CodeAlpha Store
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="cart.html">
                Cart
                <span id="cart-count">0</span>
            </a>

            <a href="orders.html">
                My Orders
            </a>

            <a
                href="login.html"
                id="login-link"
            >
                Login
            </a>

            <a
                href="#"
                id="logout-link"
                style="display: none;"
            >
                Logout
            </a>

        </nav>

    </header>


    <!-- ===============================
         Login Section
    ================================ -->

    <main>

        <section class="auth-section">

            <div class="auth-container">

                <h2>
                    Welcome Back
                </h2>

                <p class="auth-subtitle">
                    Login to your account
                </p>


                <form id="login-form">

                    <div class="form-group">

                        <label for="login-email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="login-email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="login-password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="login-password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="primary-button auth-button"
                    >
                        Login
                    </button>

                </form>


                <p
                    id="login-message"
                    class="auth-message"
                ></p>


                <p class="auth-footer">

                    Don't have an account?

                    <a href="register.html">
                        Register here
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- ===============================
         Footer
    ================================ -->

    <footer>

        <p>
            © 2026 CodeAlpha Store.
            All rights reserved.
        </p>

    </footer>


    <!-- ===============================
         JavaScript
    ================================ -->

    <script src="js/common.js"></script>

    <script src="js/auth.js"></script>

</body>

</html>
